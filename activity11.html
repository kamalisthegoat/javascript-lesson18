<!DOCTYPE html>
<html>

<head>
    <title>Date and Day</title>

    <script>
        function showDateDay() {
            var todayDate = new Date();

            var date = todayDate.getDate();
            var month = todayDate.getMonth() + 1; 
            var year = todayDate.getFullYear();
            var dayNumber = todayDate.getDay();

            var dayName;

            if (dayNumber === 0) dayName = "Sunday";
            else if (dayNumber === 1) dayName = "Monday";
            else if (dayNumber === 2) dayName = "Tuesday";
            else if (dayNumber === 3) dayName = "Wednesday";
            else if (dayNumber === 4) dayName = "Thursday";
            else if (dayNumber === 5) dayName = "Friday";
            else if (dayNumber === 6) dayName = "Saturday";

            var calendar = "Date: " + date + "/" + month + "/" + year + " Day: " + dayName;

            document.getElementById("calander").innerText = calendar;
        }
    </script>
</head>

<body onload="showDateDay()">

    <div id="calander"></div>

</body>

</html>
